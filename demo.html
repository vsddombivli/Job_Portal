<script type="module">
const SKILLS = ['Tally','Excel','GST','Accounting','Bookkeeping','Sales','Customer service','Communication','Data entry','MS Office','Administration','Inventory','Payroll','Recruitment','Teaching','English','Hindi','Gujarati','JavaScript','HTML','CSS','React','Python','SQL','Java','Digital marketing','Social media','Graphic design','AutoCAD','Banking','Finance','Logistics','Operations','Retail','Purchase','Typing','Power BI','SAP','Word','Email','HR','Taxation'];
const aliases={'ms excel':'excel','microsoft excel':'excel','tally prime':'tally','tally erp':'tally','accounts':'accounting','customer support':'customer service','human resources':'hr','js':'javascript'};
const normal = s => String(s||'').trim().toLowerCase().replace(/\s+/g,' ');
const terms = s => [...new Set((Array.isArray(s)?s:String(s||'').split(',')).map(normal).filter(Boolean).map(x=>aliases[x]||x))];
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function extractResume(text){
 const clean=text.slice(0,150000);const low=normal(clean);
 const found=SKILLS.filter(skill=>new RegExp('(^|[^a-z0-9])'+skill.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'([^a-z0-9]|$)','i').test(clean));
 for(const [alias,canonical] of Object.entries(aliases)){if(low.includes(alias)&&!found.some(x=>normal(x)===canonical))found.push(SKILLS.find(x=>normal(x)===canonical)||canonical);}
 return {skills:found,email:clean.match(/[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}/i)?.[0]||'',phone:clean.match(/(?:\+91[\s-]?)?[6-9](?:[\s-]?\d){9}\b/)?.[0]?.replace(/[\s-]/g,'')||''};
}
function matchJob(profile,job){
 const skills=terms(profile.skills);const wanted=terms(job.skills);const common=wanted.filter(x=>skills.includes(x));
 const reasons=[];let total=0,available=0;
 const part=(weight,score)=>{available+=weight;total+=weight*score;};
 if(wanted.length){part(40,common.length/wanted.length);if(common.length)reasons.push('skills');}
 if(profile.roles||profile.employment_type){let n=0,d=0;
  if(profile.roles&&job.category){const role=terms(profile.roles).some(x=>normal(job.category).includes(x)||normal(job.title).includes(x));n+=role?20:0;d+=20;if(role)reasons.push('role');}
  if(profile.employment_type&&job.employment_type){const type=profile.employment_type===job.employment_type;n+=type?5:0;d+=5;if(type)reasons.push('employment type');}
  if(d)part(25,n/d);
 }
 if(profile.cities||profile.work_mode){let n=0,d=0;
  if(profile.cities){const loc=terms(profile.cities).some(x=>normal(job.city).includes(x))||job.work_mode==='Remote'||profile.relocate;n+=loc?10:0;d+=10;if(loc)reasons.push('location');}
  if(profile.work_mode&&profile.work_mode!=='Any'){const mode=profile.work_mode===job.work_mode;n+=mode?5:0;d+=5;if(mode)reasons.push('work mode');}
  if(d)part(15,n/d);
 }
 if(profile.experience!==null&&profile.experience!==undefined&&profile.experience!==''){const years=Number(profile.experience);const exp=years>=Number(job.experience_min||0)&&(job.experience_max==null||years<=Number(job.experience_max));part(10,exp?1:0);if(exp)reasons.push('experience');}
 if(Number(profile.expected_ctc)>0&&Number(job.salary_max)>0){const pay=Number(job.salary_max)>=Number(profile.expected_ctc);part(10,pay?1:0);if(pay)reasons.push('salary');}
 const missing=terms(job.mandatory_skills).filter(x=>!skills.includes(x));
 return {score:available?Math.round(total/available*100):0,reasons,eligible:missing.length===0,missing};
}
function isOpen(job,today=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Kolkata',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())){return job.status==='published'&&(!job.closes_on||job.closes_on>=today);}
function completion(p){const keys=['full_name','phone','city','roles','skills','employment_status','experience','cities'];return Math.round(keys.filter(k=>Array.isArray(p[k])?p[k].length:p[k]!==null&&p[k]!==undefined&&p[k]!=='').length/keys.length*100);}
function validateProfile(p){if(!String(p.full_name||'').trim())throw Error('Please enter your name.');if(!/^\+?[0-9]{10,15}$/.test(p.phone||''))throw Error('Enter a valid mobile number, including country code if needed.');if(!p.roles?.trim()||!p.skills?.length||!p.cities?.trim())throw Error('Add preferred roles, at least one skill, and preferred locations.');for(const k of ['experience','current_ctc','expected_ctc'])if(p[k]!=null&&(!Number.isFinite(Number(p[k]))||Number(p[k])<0))throw Error('Experience and salary cannot be negative.');}
function validateJob(j){for(const k of ['title','company','city','category','description'])if(!String(j[k]||'').trim())throw Error('Complete all required job fields.');if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(j.recipient_email||''))throw Error('Enter a valid employer email.');if(!j.source_verified)throw Error('Verify the employer before saving.');if(Number(j.experience_min)<0||(j.experience_max!=null&&Number(j.experience_max)<Number(j.experience_min)))throw Error('Check the experience range.');if(j.salary_min!=null&&j.salary_max!=null&&Number(j.salary_min)>Number(j.salary_max))throw Error('Minimum salary cannot exceed maximum salary.');}

async function readResume(file){
 if(file.size>2*1024*1024)throw Error('Please upload a CV smaller than 2 MB.');
 const ext=file.name.split('.').pop().toLowerCase();if(!['pdf','docx'].includes(ext))throw Error('Please choose a PDF or DOCX file.');
 const bytes=await file.arrayBuffer();let text='';
 if(ext==='pdf'){
  const pdfjs=await import('https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs');
  pdfjs.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs';
  const doc=await pdfjs.getDocument({data:bytes,isEvalSupported:false}).promise;
  try{if(doc.numPages>30)throw Error('Please use a CV of 30 pages or fewer.');for(let i=1;i<=doc.numPages;i++){const page=await doc.getPage(i);const content=await page.getTextContent();text+=content.items.map(x=>x.str||'').join(' ')+'\n';}}finally{await doc.destroy();}
 }else{
  if(!window.mammoth){await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/mammoth@1.9.0/mammoth.browser.min.js';s.onload=resolve;s.onerror=()=>{s.remove();reject(Error('Document reader could not load. Enter your profile manually or try again.'));};document.head.append(s);});}
  text=(await window.mammoth.extractRawText({arrayBuffer:bytes})).value;
 }
 if(text.trim().length<30)throw Error('This CV has no readable text. Use a text-based PDF/DOCX or complete your profile manually; scanned CV OCR is not included yet.');
 return {...extractResume(text),ext};
}

const state={lang:localStorage.getItem('sj-language')||'en',demo:false,admin:false,page:'jobs',profile:null,jobs:[],applications:[],candidates:[],search:'',city:'',mode:'',busy:false};

const t=s=>state.lang==='hi'?(dictionary[s]||s):s;
const E=s=>esc(t(s));
const button=(label,action,cls='',extra='')=>`<button ${extra.includes('type=')?'':'type="button"'} class="btn ${cls}" data-action="${action}" ${extra}>${E(label)}</button>`;
function toast(msg,error=false){const el=document.querySelector('#toast');el.textContent=t(msg);el.className='show'+(error?' error':'');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.className='',6500);}
function showModal(content){document.querySelector('#modal-content').innerHTML=content;if(!modal.open)modal.showModal();}
function dialogHead(title){return `<div class="dialog-head"><h2>${E(title)}</h2><button class="close" data-action="close" aria-label="${E('Close')}">×</button></div>`;}
function closeModal(){modal.close();document.querySelector('#modal-content').innerHTML='';}
const checked=v=>v?'checked':'';
function field(label,name,value='',type='text',extra=''){return `<label class="field">${E(label)}<input name="${name}" type="${type}" value="${esc(value??'')}" ${extra}></label>`;}
function select(label,name,options,value){return `<label class="field">${E(label)}<select name="${name}">${options.map(x=>`<option value="${esc(x)}" ${x===value?'selected':''}>${E(x)}</option>`).join('')}</select></label>`;}
function logo(){return `<div class="brand"><span class="mark" aria-hidden="true">↗</span><div>Sadharmik<span style="color:#8a9a77"> Jobs</span><small>${E('A community that opens doors')}</small></div></div>`;}
function header(){return `<header class="topbar">${logo()}<div class="top-actions"><select class="lang" aria-label="Language / भाषा" id="language"><option value="en" ${state.lang==='en'?'selected':''}>English</option><option value="hi" ${state.lang==='hi'?'selected':''}>हिंदी</option></select>${state.profile?`<span class="avatar">${esc(state.profile.full_name?.[0]||'S')}</span><span class="user-name small">${esc(state.profile.full_name)}</span>${button('Sign out','logout','ghost')}`:''}</div></header>`;}
function renderAuth(){app.innerHTML=header()+`<main class="auth-shell"><div class="auth-copy"><span class="eyebrow">${E('For the Jain community')}</span><h1>${E('Your next chapter starts here.')}</h1><p>${E('Find meaningful work, with a community beside you.')}</p><div class="trust"><span>✓ ${E('Verified opportunities. A little guidance. A fresh start.')}</span></div></div><section class="auth-card"><h2>${E('Welcome back')}</h2><p class="muted small">${E('Use the email and temporary password shared by your admin.')}</p><form id="login-form">${field('Email address','email','','email','required autocomplete="username"')}${field('Password','password','','password','required autocomplete="current-password"')}<label class="check" style="margin-bottom:18px"><input type="checkbox" id="show-password"> ${state.lang==='hi'?'पासवर्ड दिखाएँ':'Show password'}</label>${button('Sign in','', '', 'type="submit"')}</form><button class="btn ghost" data-action="help" style="width:100%;margin-top:9px">${E('Help with access')}</button><div class="auth-footer"><p>${E('Your account is created and approved by an admin.')}</p>${button('Explore the demo','demo','secondary')}</div>${!cfg.supabaseUrl?`<p class="small muted" style="margin-top:16px">${state.lang==='hi'?'लाइव लॉगिन के लिए Supabase सेटअप आवश्यक है। अभी डेमो देखें।':'Live sign-in needs Supabase configuration. Explore the demo below.'}</p>`:''}</section></main>`;}
function nav(){const rows=state.admin?[['jobs','▦','Job openings'],['candidates','♙','Candidates'],['applications','▤','Applications'],['help','?','Help & support']]:[['jobs','▦','Find jobs'],['applications','▤','My applications'],['profile','♙','My profile'],['help','?','Help & support']];return `<aside class="sidebar"><div class="nav-title">${E(state.admin?'Admin workspace':'Candidate workspace')}</div>${rows.map(([page,icon,label])=>`<button class="nav-item ${state.page===page?'active':''}" data-page="${page}"><span class="nav-icon" aria-hidden="true">${icon}</span>${E(label)}</button>`).join('')}<div class="sidebar-note"><strong>${E('Need a helping hand?')}</strong><p>${E('Our coordinators are here to help you get started.')}</p><button class="btn ghost" data-page="help" style="padding:0;min-height:30px">${E('Get help')} ↗</button></div></aside>`;}
function render(){if(!state.profile)return renderAuth();if(state.profile.must_change_password)return renderPassword();app.innerHTML=(state.demo?`<div class="demo-banner"><span>${state.lang==='hi'?'डेमो • काल्पनिक डेटा • इस टैब तक सीमित':'INTERACTIVE DEMO · Fictional data · Changes last for this tab only'}</span><button data-action="switch-role">${state.admin?'Try candidate view':'Try admin view'} ↗</button></div>`:'')+header()+`<div class="layout">${nav()}<main class="main" id="main">${state.page==='jobs'?jobsPage():state.page==='profile'?profilePage():state.page==='applications'?applicationsPage():state.page==='candidates'?candidatesPage():helpPage()}<footer class="footer"><span>© ${new Date().getFullYear()} Sadharmik Jobs · ${E('Community first. Careers forward.')}</span><span>${state.lang==='hi'?'समुदाय द्वारा संचालित • उम्मीदवारों के लिए निःशुल्क':'Community-led · Free for candidates'}</span></footer></main></div>`;}
function renderPassword(){app.innerHTML=header()+`<main class="auth-shell"><div class="auth-copy"><span class="eyebrow">${E('My account')}</span><h1>${E('Set your own password to continue.')}</h1><p>${E('Passwords must have at least 12 characters.')}</p></div><section class="auth-card"><form id="password-form">${field('Current password','current','','password','required autocomplete="current-password"')}${field('New password','password','','password','required minlength="12" autocomplete="new-password"')}${field('Confirm password','confirm','','password','required minlength="12" autocomplete="new-password"')}${button('Save password','','','type="submit"')}</form></section></main>`;}
function welcome(title,desc){return `<div class="welcome"><div><span class="eyebrow">${E(state.admin?'Admin workspace':'For the Jain community')}</span><h1>${esc(title)}</h1><p class="muted">${esc(desc)}</p></div><span class="date-label">${new Date().toLocaleDateString(state.lang==='hi'?'hi-IN':'en-IN',{day:'numeric',month:'long',year:'numeric'})}</span></div>`;}
function salary(j){if(!j.salary_min&&!j.salary_max)return t('Not disclosed');return `₹${j.salary_min||'—'}–${j.salary_max||'—'} ${state.lang==='hi'?'लाख / वर्ष':'lakh / year'}`;}
function filteredJobs(){return state.jobs.filter(j=>(state.admin||isOpen(j))&&(!state.search||[j.title,j.company,j.city,...(j.skills||[])].join(' ').toLowerCase().includes(state.search.toLowerCase()))&&(!state.city||j.city===state.city)&&(!state.mode||j.work_mode===state.mode)).map(j=>({...j,match:matchJob(state.profile,j)})).sort((a,b)=>state.admin?new Date(b.created_at)-new Date(a.created_at):Number(b.match.eligible)-Number(a.match.eligible)||b.match.score-a.match.score);}
function jobsPage(){const open=state.jobs.filter(j=>isOpen(j)),good=open.filter(j=>{const m=matchJob(state.profile,j);return m.eligible&&m.score>=60;}).length;return welcome(state.admin?t('Manage openings'):(state.lang==='hi'?`नमस्ते, ${state.profile.full_name.split(' ')[0]}।`:`A new opportunity awaits, ${state.profile.full_name.split(' ')[0]}.`),t(state.admin?'Email delivery is not configured. Applications are saved for admin review.':'Find meaningful work, with a community beside you.'))+(state.admin?`<div class="notice">${E('Email delivery is not configured. Applications are saved for admin review.')}</div><div class="form-actions" style="margin:0 0 20px">${button('Add opening','new-job')}${button('Create candidate','new-candidate','secondary')}</div>`:`<section class="hero"><div><span class="small" style="color:#c7d6bd">${E('Community first. Careers forward.')}</span><h2 style="margin-top:10px">${E('A few details can open more doors.')}</h2><p>${state.lang==='hi'?'अपनी प्रोफ़ाइल और कौशल अपडेट करें, ताकि हम सही अवसर दिखा सकें।':'Your experience matters. Keep your profile up to date so the right opportunities can find you.'}</p>${button('Update profile','go-profile')}<span class="small" style="margin-left:13px;color:#d5e3dc">${completion(state.profile)}% ${state.lang==='hi'?'पूरी':'complete'}</span></div><div class="hero-art" aria-hidden="true"><span>GROW, TOGETHER.</span></div></section>`)+`<section class="stats"><div class="stat"><strong>${open.length}</strong><span>${E('Open opportunities')}</span></div><div class="stat"><strong>${state.admin?state.candidates.length:good}</strong><span>${E(state.admin?'Candidates':'Good matches')}</span></div><div class="stat"><strong>${state.applications.length}</strong><span>${E(state.admin?'Applications':'Your applications')}</span></div></section><div class="section-head"><h2>${E(state.admin?'All openings':'Recommended for you')}</h2><span class="pill">✓ ${E('Verified source')}</span></div><div class="filters"><input id="job-search" aria-label="${E('Search role, company or skill')}" placeholder="${E('Search role, company or skill')}" value="${esc(state.search)}"><select id="job-city" aria-label="${E('Location')}"><option value="">${E('All locations')}</option>${[...new Set(state.jobs.map(j=>j.city))].sort().map(c=>`<option ${c===state.city?'selected':''}>${esc(c)}</option>`).join('')}</select><select id="job-mode" aria-label="${E('Preferred work mode')}"><option value="">${E('Any work mode')}</option>${['Office','Remote','Hybrid'].map(m=>`<option value="${m}" ${m===state.mode?'selected':''}>${E(m)}</option>`).join('')}</select></div><div class="jobs" id="jobs-list">${jobCards()}</div>`;}
function jobCards(){const jobs=filteredJobs();return jobs.length?jobs.map(j=>`<article class="job"><div class="job-top"><div class="company-logo" aria-hidden="true">${esc(j.company[0])}</div><div><h3>${esc(j.title)}</h3><p>${esc(j.company)}</p></div>${state.admin?`<span class="match">${esc(j.status)}${j.status==='published'&&!isOpen(j)?' · expired':''}</span>`:`<span class="match">${j.match.score}% ${state.lang==='hi'?'मेल':'match'}</span>`}</div><div class="job-meta"><span>⌖ ${esc(j.city)} · ${E(j.work_mode)}</span><span>◷ ${j.experience_min}–${j.experience_max??'+'} ${state.lang==='hi'?'वर्ष':'years'}</span><span>${E(j.employment_type)}</span></div><div class="tags">${(j.skills||[]).slice(0,4).map(s=>`<span class="tag">${esc(s)}</span>`).join('')}${j.freshers?`<span class="tag">${E('Freshers welcome')}</span>`:''}${j.career_break?`<span class="tag">${E('Career breaks welcome')}</span>`:''}</div><div class="job-bottom"><span class="salary">${esc(salary(j))}</span>${button(state.admin?'Edit':'View job',state.admin?'edit-job':'view-job','secondary',`data-id="${j.id}"`)}</div></article>`).join(''):`<div class="empty full"><span class="symbol">⌕</span><h3>${E('No openings found')}</h3><p class="muted">${E('Try a different search or check again soon.')}</p></div>`;}
function profilePage(){const p=state.profile;return welcome(t('My profile'),t('Profile information is private to you and authorised community admins.'))+`<form id="profile-form"><section class="panel"><h2>${E('Resume / CV')}</h2><div class="upload"><p><strong>${E('Upload PDF or DOCX, up to 2 MB.')}</strong></p><input type="file" id="cv-file" accept=".pdf,.docx" aria-label="${E('Resume / CV')}"><div class="form-actions" style="justify-content:center;margin-top:12px">${button('Read CV & suggest skills','read-cv','secondary')}</div><p class="small muted" style="margin-top:14px">${E('No CV? You can fill in your profile below.')}</p>${p.cv_name?`<p class="small">${E('Saved')}: ${esc(p.cv_name)}</p>${p.cv_path?button('View CV','own-cv','ghost'):''}`:''}<p id="cv-status" class="small" role="status"></p></div></section><section class="panel"><h2>${E('My profile')}</h2><div class="form-grid">${field('Full name','full_name',p.full_name,'text','required maxlength="120"')}${field('Email address','email',p.email,'email','disabled')}${field('Mobile number','phone',p.phone,'tel','required maxlength="16" autocomplete="tel"')}${field('Current city','city',p.city,'text','maxlength="100"')}${field('Preferred roles','roles',p.roles,'text','required placeholder="Accounting, Administration" maxlength="250"')}${field('Skills','skills',(p.skills||[]).join(', '),'text','required placeholder="Tally, Excel, GST" maxlength="1500"')}${field('Experience (years)','experience',p.experience,'number','required min="0" max="70" step="0.5"')}${select('Employment status','employment_status',['Fresher','Working','Looking for work','Returning after a break'],p.employment_status)}${field('Current / last CTC (₹ lakh/year)','current_ctc',p.current_ctc,'number','min="0" max="1000" step="0.1"')}${field('Expected CTC (₹ lakh/year)','expected_ctc',p.expected_ctc,'number','min="0" max="1000" step="0.1"')}<p class="small muted full" style="margin:0">${state.lang==='hi'?'वेतन खाली छोड़ सकते हैं यदि तय नहीं है या बातचीत संभव है।':'Leave salary blank if unsure or negotiable. All amounts are annual CTC in ₹ lakh.'}</p>${field('Preferred cities','cities',p.cities,'text','required placeholder="Mumbai, Ahmedabad" maxlength="250"')}${select('Joining availability','notice_period',['Immediately','15 days','30 days','60 days','90 days'],p.notice_period)}${select('Preferred work mode','work_mode',['Any','Office','Remote','Hybrid'],p.work_mode)}${select('Employment type','employment_type',['Full-time','Part-time','Contract'],p.employment_type)}${select('Email alert preference','alerts',['weekly','daily','off'],p.alerts||'weekly')}<div class="full stack"><label class="check"><input type="checkbox" name="relocate" ${checked(p.relocate)}>${E('Willing to relocate')}</label><label class="check"><input type="checkbox" name="urgent" ${checked(p.urgent)}>${E('I need work urgently (visible only to admins)')}</label></div><label class="check full"><input type="checkbox" name="consent" required ${checked(p.consent)}>${E('I agree to profile processing and sharing my details with employers when I apply.')}</label></div><p class="small muted" style="margin-top:15px">${E('Email alert preferences are saved; delivery will begin only when email is configured.')}</p><div class="form-actions">${button('Save profile','','','type="submit"')}${button('Change password','password-dialog','secondary')}</div></section></form>`;}
function applicationsPage(){return welcome(t(state.admin?'Applications':'My applications'),t('Application status is updated by your community admin.'))+`<div class="notice">${E('Email delivery is not configured. Applications are saved for admin review.')}</div><section class="panel">${state.applications.length?state.applications.map(a=>{const j=state.jobs.find(j=>j.id===a.job_id)||a.job_snapshot||{};return `<article class="list-row"><div class="company-logo">${esc((j.company||'?')[0])}</div><div class="grow"><h3>${esc(j.title||'Opening')}</h3><p>${esc(j.company||'')} · ${new Date(a.created_at).toLocaleDateString(state.lang==='hi'?'hi-IN':'en-IN')}</p>${state.admin?`<p>${esc(a.profile_snapshot?.full_name)} · ${esc(a.profile_snapshot?.phone)}</p>`:''}<p>${state.lang==='hi'?'ईमेल: अभी उपलब्ध नहीं':'Email: not configured'}</p></div><span class="status">${E(a.status)}</span>${state.admin?button('Review applicants','review-application','secondary',`data-id="${a.id}"`):a.status!=='withdrawn'?button('Withdraw','withdraw','ghost',`data-id="${a.id}"`):''}</article>`;}).join(''):`<div class="empty"><span class="symbol">▤</span><h3>${E('No applications yet')}</h3><p class="muted">${E('When you apply, you can follow your progress here.')}</p>${button('Find jobs','go-jobs','secondary')}</div>`}</section>`;}
function candidatesPage(){return welcome(t('Candidates'),state.lang==='hi'?'समुदाय की सहायता करें, हर कदम पर।':'Help each person take their next step.')+`<div class="form-actions" style="margin:0 0 22px">${button('Create candidate','new-candidate')}</div><div class="filters"><input id="candidate-search" placeholder="${E('Search candidates')}" aria-label="${E('Search candidates')}"></div><section class="panel" id="candidate-list">${candidateRows('')}</section>`;}
function candidateRows(q){const rows=state.candidates.filter(p=>[p.full_name,p.email,p.city,p.roles,...(p.skills||[])].join(' ').toLowerCase().includes(q.toLowerCase()));return rows.length?rows.map(p=>`<article class="list-row"><span class="avatar">${esc(p.full_name?.[0]||'?')}</span><div class="grow"><h3>${esc(p.full_name)}</h3><p>${esc(p.email)} · ${esc(p.city||'—')} · ${p.experience??0} ${state.lang==='hi'?'वर्ष':'years'}</p><p>${esc((p.skills||[]).join(', '))}</p><span class="status">${p.active?(state.lang==='hi'?'सक्रिय':'Active'):(state.lang==='hi'?'रुका हुआ':'Paused')}</span> ${p.urgent?'<span class="pill">Urgent support needed</span>':''}</div>${button('My profile','candidate-details','secondary',`data-id="${p.id}"`)}${button('Reset password','reset-candidate','ghost',`data-id="${p.id}"`)}${button(p.active?'Pause':'Activate','toggle-candidate','ghost',`data-id="${p.id}"`)}</article>`).join(''):`<div class="empty">${state.lang==='hi'?'कोई उम्मीदवार नहीं मिला।':'No candidates found. Create the first approved account above.'}</div>`;}
function helpPage(){return welcome(t('Help & support'),t('Our coordinators are here to help you get started.'))+`<section class="panel"><h2>${E('Help with access')}</h2><p>${E('Your account is created and approved by an admin.')}</p><p>${E('Please contact your community coordinator.')}</p><p class="notice green">${esc(cfg.supportContact||t('Please contact your community coordinator.'))}</p><h3>${E('Password')}</h3><p>${state.lang==='hi'?'पासवर्ड भूलने पर एडमिन आपकी पहचान सत्यापित करके अस्थायी पासवर्ड देगा। अगली बार लॉगिन पर नया पासवर्ड बनाना होगा।':'If you forget your password, an admin will verify your identity and issue a temporary password. You must set a new password at the next sign-in.'}</p>${button('Change password','password-dialog','secondary')}</section><section class="panel"><h2>${state.lang==='hi'?'आपकी जानकारी, आपकी पसंद':'Your information, your choice'}</h2><p>${E('Profile information is private to you and authorised community admins.')}</p><p>${state.lang==='hi'?'आवेदन करते समय आपकी संपर्क जानकारी और उस समय का CV एडमिन और संबंधित नियोक्ता के लिए साझा किया जा सकता है। ईमेल अभी बंद है। खाता हटवाने या सहायता के लिए समन्वयक से संपर्क करें।':'Applying saves a copy of your submitted profile and CV for authorised admins and eventual sharing with that employer. Email is currently disabled. Contact your coordinator for account deletion or assistance. Previously downloaded/shared information cannot be recalled.'}</p><p>${state.lang==='hi'?'नौकरी के लिए कोई शुल्क न दें। संदिग्ध विज्ञापन की सूचना एडमिन को दें।':'Never pay a recruitment fee. Report suspicious openings to your coordinator.'}</p></section>`;}
function detailJob(id){const j=state.jobs.find(x=>x.id===id);if(!j)return;const m=matchJob(state.profile,j),applied=state.applications.some(a=>a.job_id===id);showModal(dialogHead('Job details')+`<span class="pill">✓ ${E('Verified source')}</span><h2 style="margin-top:18px">${esc(j.title)}</h2><p class="muted">${esc(j.company)} · ${esc(j.city)} · ${E(j.work_mode)}</p><p><strong>${esc(salary(j))}</strong> · ${j.experience_min}–${j.experience_max??'+'} ${state.lang==='hi'?'वर्ष':'years'}</p><div class="tags">${(j.skills||[]).map(s=>`<span class="tag">${esc(s)}</span>`).join('')}</div>${m.reasons.length?`<p class="small muted">${state.lang==='hi'?'मेल के कारण':'Matches your'}: ${m.reasons.map(E).join(', ')}</p>`:''}<p class="details">${esc(j.description)}</p>${j.mandatory_skills?.length?`<p><strong>${E('Required skills')}:</strong> ${esc(j.mandatory_skills.join(', '))}</p>`:''}<p class="small muted">${state.lang==='hi'?'समापन तिथि':'Closing date'}: ${esc(j.closes_on||'—')}</p>${!m.eligible?`<div class="notice">${state.lang==='hi'?'आवेदन से पहले आवश्यक कौशल पूरे करें':'Required skills to apply'}: ${esc(m.missing.join(', '))}</div>`:''}<div class="notice">${E('Email delivery is not configured. Applications are saved for admin review.')}</div>${!applied&&isOpen(j)?`<form id="apply-form" data-id="${j.id}"><label class="check"><input type="checkbox" required>${state.lang==='hi'?'मैं इस नौकरी के लिए अपनी प्रोफ़ाइल, मोबाइल और CV साझा करने के लिए सहमत हूँ।':'I consent to share my submitted profile, mobile number and CV for this job.'}</label><div class="form-actions">${button('Apply now','','','type="submit" '+(!m.eligible?'disabled':''))}</div></form>`:`<span class="status">${E(applied?'Applied':'Closed')}</span>`}`);}
function jobEditor(id){const j=state.jobs.find(x=>x.id===id)||{status:'draft',work_mode:'Office',employment_type:'Full-time',experience_min:0};showModal(dialogHead(id?'Edit':'Add opening')+`<form id="job-form" data-id="${id||''}"><div class="form-grid">${field('Job title','title',j.title,'text','required maxlength="150"')}${field('Company','company',j.company,'text','required maxlength="150"')}${field('Location','city',j.city,'text','required maxlength="100"')}${field('Category / role','category',j.category,'text','required placeholder="Accounting" maxlength="100"')}${field('Skills','skills',(j.skills||[]).join(', '),'text','maxlength="1500"')}${field('Required skills','mandatory_skills',(j.mandatory_skills||[]).join(', '),'text','maxlength="1000"')}${field('Minimum experience (years)','experience_min',j.experience_min,'number','required min="0" max="70" step="0.5"')}${field('Maximum experience (blank = any)','experience_max',j.experience_max,'number','min="0" max="70" step="0.5"')}${field('Minimum salary (₹ lakh/year)','salary_min',j.salary_min,'number','min="0" max="1000" step="0.1"')}${field('Maximum salary (₹ lakh/year)','salary_max',j.salary_max,'number','min="0" max="1000" step="0.1"')}${select('Preferred work mode','work_mode',['Office','Remote','Hybrid'],j.work_mode)}${select('Employment type','employment_type',['Full-time','Part-time','Contract'],j.employment_type)}${field('Employer email (private)','recipient_email',j.recipient_email,'email','required maxlength="250"')}${field('Contact person / source','source',j.source,'text','required maxlength="250"')}${field('Closing date','closes_on',j.closes_on,'date')}${select('Status','status',['draft','published','closed'],j.status)}<label class="field full">${state.lang==='hi'?'काम का विवरण':'Job description'}<textarea name="description" required maxlength="8000">${esc(j.description||'')}</textarea></label><div class="full stack"><label class="check"><input name="freshers" type="checkbox" ${checked(j.freshers)}>${E('Freshers welcome')}</label><label class="check"><input name="career_break" type="checkbox" ${checked(j.career_break)}>${E('Career breaks welcome')}</label></div><label class="check full"><input type="checkbox" name="source_verified" required ${checked(j.source_verified)}>${state.lang==='hi'?'मैंने नियोक्ता और इस नौकरी की पुष्टि की है।':'I have verified this employer and opening.'}</label></div><p class="small muted" style="margin-top:15px">${E('Email sending is disabled')}</p><div class="form-actions">${button('Save changes','','','type="submit"')}${button('Cancel','close','secondary')}</div></form>`);}
async function load(){
 if(state.demo){state.profile=demoData.profile;state.jobs=demoData.jobs;state.applications=demoData.applications;state.candidates=demoData.candidates;render();return;}
 const {data:{user},error:authError}=await db.auth.getUser();if(authError||!user)throw Error('Session expired. Please sign in again.');
 const {data:p,error}=await db.from('profiles').select('*').eq('id',user.id).single();if(error)throw error;if(!p.active){await db.auth.signOut();throw Error('Your account is paused. Contact your coordinator.');}state.profile=p;state.admin=p.role==='admin';
 if(p.must_change_password){render();return;}
 const results=await Promise.all([db.from('jobs').select('*').order('created_at',{ascending:false}),db.from('applications').select('*').order('created_at',{ascending:false}),state.admin?db.from('profiles').select('*').eq('role','candidate').order('created_at',{ascending:false}):Promise.resolve({data:[],error:null}),state.admin?db.from('job_contacts').select('*'):Promise.resolve({data:[],error:null})]);
 for(const r of results)if(r.error)throw r.error;
 [state.jobs,state.applications,state.candidates]=results.map(r=>r.data||[]);for(const j of state.jobs)Object.assign(j,(results[3].data||[]).find(c=>c.job_id===j.id)||{});render();
}
async function api(body){if(state.demo)throw Error('This action needs a live Supabase connection.');const {data,error}=await db.functions.invoke('account-admin',{body});if(error){let message=error.message;try{message=(await error.context.json()).error||message;}catch{}throw Error(message);}if(data.error)throw Error(data.error);return data;}
function accountForm(id){const p=state.candidates.find(p=>p.id===id);showModal(dialogHead(id?'Reset password':'Create candidate')+`<form id="candidate-form" data-id="${id||''}"><p class="small muted">${state.lang==='hi'?'अस्थायी पासवर्ड को उम्मीदवार से सुरक्षित रूप से साझा करें। यह सहेजा या ईमेल नहीं होगा।':'Share the temporary password privately with the candidate. It is not stored in the app or sent by email.'}</p>${id?`<p><strong>${esc(p.full_name)}</strong> · ${esc(p.email)}</p>`:field('Full name','full_name','','text','required maxlength="120"')+field('Email address','email','','email','required')}${field('Temporary password','password','','password','required minlength="12" autocomplete="new-password"')}<label class="check" style="margin-top:14px"><input type="checkbox" name="verified" required>${id?E('Identity verified before reset'):(state.lang==='hi'?'मैंने उम्मीदवार की पात्रता, सहमति और ईमेल की पुष्टि की है।':'I have verified community eligibility, consent, and the candidate’s email ownership.')}</label><div class="form-actions">${button(id?'Reset password':'Create candidate','','','type="submit"')}</div></form>`);}
async function viewCV(path){if(!path)throw Error('No CV was submitted.');if(state.demo){toast('CV preview is available after Supabase setup.');return;}const {data,error}=await db.storage.from('cvs').createSignedUrl(path,60);if(error)throw error;showModal(dialogHead('View CV')+`<p>${state.lang==='hi'?'यह निजी लिंक एक मिनट में समाप्त हो जाएगा।':'This private download link expires in one minute.'}</p><a class="btn" href="${esc(data.signedUrl)}" target="_blank" rel="noopener noreferrer">${E('View CV')} ↗</a>`);}
function candidateDetails(id){const p=state.candidates.find(x=>x.id===id);if(!p)return;showModal(dialogHead('My profile')+`<h3>${esc(p.full_name)}</h3><p>${esc(p.email)} · ${esc(p.phone||'—')}</p><p>${esc(p.city||'—')} · ${p.experience??0} ${state.lang==='hi'?'वर्ष':'years'}</p><p>${E('Preferred roles')}: ${esc(p.roles||'—')}</p><p>${E('Skills')}: ${esc((p.skills||[]).join(', ')||'—')}</p><p>${E('Preferred cities')}: ${esc(p.cities||'—')}</p><p>${E('Expected CTC (₹ lakh/year)')}: ${p.expected_ctc??'—'}</p><p>${E('Joining availability')}: ${E(p.notice_period||'—')}</p><p>${E('Employment status')}: ${E(p.employment_status||'—')}</p>${p.urgent?'<div class="notice">Urgent support requested</div>':''}${p.cv_path?button('View CV','candidate-cv','secondary',`data-id="${p.id}"`):''}`);}
function reviewApplication(id){const a=state.applications.find(x=>x.id===id);if(!a)return;const p=a.profile_snapshot||{};showModal(dialogHead('Applications')+`<h3>${esc(p.full_name)}</h3><p>${esc(p.email)} · ${esc(p.phone)}</p><p>${E('Skills')}: ${esc((p.skills||[]).join(', '))}</p><p>${E('Experience')}: ${esc(p.experience??'—')}</p><p>${E('Expected CTC (₹ lakh/year)')}: ${esc(p.expected_ctc??'—')}</p><p>${E('Preferred cities')}: ${esc(p.cities||'—')}</p><div class="notice">${E('Email delivery is not configured. Applications are saved for admin review.')}</div>${a.cv_path?button('View CV','application-cv','secondary',`data-id="${a.id}"`):''}<form id="status-form" data-id="${a.id}" style="margin-top:20px">${select('Status','status',a.status==='withdrawn'?['withdrawn']:['applied','under_review','interview','selected','not_selected','withdrawn'],a.status)}<div class="form-actions">${button('Save changes','','','type="submit"')}</div></form>`);}
async function action(name,id){
 switch(name){
 case 'close':closeModal();return;
 case 'demo':state.demo=true;demoData=seedDemo();state.admin=false;state.page='jobs';await load();return;
 case 'switch-role':state.admin=!state.admin;state.page='jobs';render();return;
 case 'logout':if(!state.demo)await db.auth.signOut();state.demo=false;state.profile=null;state.admin=false;state.search='';state.page='jobs';closeModal();renderAuth();return;
 case 'help':if(!state.profile)showModal(dialogHead('Help with access')+`<p>${E('Your account is created and approved by an admin.')}</p><p>${esc(cfg.supportContact||t('Please contact your community coordinator.'))}</p>`);else{state.page='help';render();}return;
 case 'go-profile':state.page='profile';render();return;
 case 'go-jobs':state.page='jobs';render();return;
 case 'view-job':detailJob(id);return;
 case 'new-job':jobEditor();return;
 case 'edit-job':jobEditor(id);return;
 case 'new-candidate':accountForm();return;
 case 'reset-candidate':accountForm(id);return;
 case 'candidate-details':candidateDetails(id);return;
 case 'own-cv':await viewCV(state.profile.cv_path);return;
 case 'candidate-cv':await viewCV(state.candidates.find(p=>p.id===id)?.cv_path);return;
 case 'application-cv':await viewCV(state.applications.find(a=>a.id===id)?.cv_path);return;
 case 'review-application':reviewApplication(id);return;
 case 'toggle-candidate':{
 const p=state.candidates.find(p=>p.id===id);if(state.demo)p.active=!p.active;else await api({action:'set-active',user_id:id,active:!p.active});await load();toast('Saved');return;}
 case 'withdraw':{
 if(!confirm(state.lang==='hi'?'यह आवेदन वापस लें?':'Withdraw this application?'))return;
 if(state.demo)state.applications.find(a=>a.id===id).status='withdrawn';else{const {error}=await db.rpc('withdraw_application',{application_id:id});if(error)throw error;}await load();return;}
 case 'password-dialog':showModal(dialogHead('Change password')+`<form id="password-form">${field('Current password','current','','password','required autocomplete="current-password"')}${field('New password','password','','password','required minlength="12" autocomplete="new-password"')}${field('Confirm password','confirm','','password','required minlength="12" autocomplete="new-password"')}<p class="small muted">${E('Passwords must have at least 12 characters.')}</p>${button('Save password','','','type="submit"')}</form>`);return;
 case 'read-cv':{
 const file=document.querySelector('#cv-file')?.files[0];if(!file)throw Error(t('Select a CV first.'));
 const form=document.querySelector('#profile-form'),el=document.querySelector('#cv-status');el.textContent=state.lang==='hi'?'CV पढ़ रहे हैं…':'Reading your CV…';
 try{const result=await readResume(file);const old=terms(form.elements.skills.value);form.elements.skills.value=[...new Set([...old,...result.skills])].join(', ');if(!form.elements.phone.value&&result.phone)form.elements.phone.value=result.phone;form.dataset.readFile=file.name;el.textContent=t('Contact details and skills are suggestions. Please check them before saving.');}catch(e){el.textContent=t('CV reading failed. You can still save your profile manually.');throw e;}return;}
 }
}
async function submit(form){const data=new FormData(form),get=k=>String(data.get(k)||'').trim(),num=k=>get(k)===''?null:Number(get(k)),yes=k=>data.has(k);
 if(form.id==='login-form'){
  if(!db)throw Error('Configure Supabase in config.js first, or explore the demo.');const {data:result,error}=await db.auth.signInWithPassword({email:get('email'),password:data.get('password')});if(error)throw error;session=result.session;await load();
 }else if(form.id==='password-form'){
  if(state.demo)throw Error('Password changes are disabled in the demo.');if(data.get('password')!==data.get('confirm'))throw Error('Passwords do not match.');if(String(data.get('password')).length<12)throw Error('Passwords must have at least 12 characters.');if(data.get('password')===data.get('current'))throw Error('Choose a different password.');await api({action:'change-password',current_password:data.get('current'),password:data.get('password')});closeModal();await db.auth.signOut({scope:'local'});state.profile=null;state.admin=false;renderAuth();toast(state.lang==='hi'?'पासवर्ड सहेजा गया। नए पासवर्ड से लॉगिन करें।':'Password saved. Sign in with your new password.');
 }else if(form.id==='profile-form'){
  const p={full_name:get('full_name'),phone:get('phone').replace(/[\s()-]/g,''),city:get('city'),roles:get('roles'),skills:get('skills').split(',').map(x=>x.trim()).filter(Boolean),experience:num('experience'),current_ctc:num('current_ctc'),expected_ctc:num('expected_ctc'),cities:get('cities'),employment_status:get('employment_status'),notice_period:get('notice_period'),work_mode:get('work_mode'),employment_type:get('employment_type'),alerts:get('alerts'),relocate:yes('relocate'),urgent:yes('urgent'),consent:yes('consent')};validateProfile(p);if(!p.consent)throw Error('Please confirm consent.');
  const file=document.querySelector('#cv-file').files[0];let uploaded=null;
  if(file){const ext=file.name.split('.').pop().toLowerCase();if(!['pdf','docx'].includes(ext)||file.size>2*1024*1024)throw Error('Use a PDF or DOCX CV of up to 2 MB.');if(!state.demo){uploaded=`${state.profile.id}/${crypto.randomUUID()}.${ext}`;const {error}=await db.storage.from('cvs').upload(uploaded,file,{contentType:ext==='pdf'?'application/pdf':'application/vnd.openxmlformats-officedocument.wordprocessingml.document',upsert:false});if(error)throw error;p.cv_path=uploaded;p.cv_name=file.name;}else{p.cv_name=file.name;p.cv_path=null;}}
  if(state.demo)Object.assign(demoData.profile,p);else{const {error}=await db.from('profiles').update(p).eq('id',state.profile.id);if(error){if(uploaded)await db.storage.from('cvs').remove([uploaded]);throw error;}}await load();toast('Profile saved.');
 }else if(form.id==='job-form'){
  const j={title:get('title'),company:get('company'),city:get('city'),category:get('category'),skills:get('skills').split(',').map(x=>x.trim()).filter(Boolean),mandatory_skills:get('mandatory_skills').split(',').map(x=>x.trim()).filter(Boolean),experience_min:num('experience_min'),experience_max:num('experience_max'),salary_min:num('salary_min'),salary_max:num('salary_max'),work_mode:get('work_mode'),employment_type:get('employment_type'),description:get('description'),closes_on:get('closes_on')||null,status:get('status'),freshers:yes('freshers'),career_break:yes('career_break'),source_verified:yes('source_verified')};validateJob({...j,recipient_email:get('recipient_email')});
  if(state.demo){j.recipient_email=get('recipient_email');j.source=get('source');if(form.dataset.id)Object.assign(state.jobs.find(x=>x.id===form.dataset.id),j);else state.jobs.unshift({...j,id:crypto.randomUUID(),created_at:new Date().toISOString()});}
  else{const {data:jobId,error}=await db.rpc('save_job',{job_id:form.dataset.id||null,payload:j,contact:{recipient_email:get('recipient_email'),source:get('source')}});if(error)throw error;}
  closeModal();await load();toast('Saved');
 }else if(form.id==='apply-form'){
  try{validateProfile(state.profile);}catch{throw Error(t('Please save your profile with a mobile number, preferred roles and skills before applying.'));}
  const id=form.dataset.id;if(state.demo){if(state.applications.some(a=>a.job_id===id))throw Error('You have already applied.');state.applications.unshift({id:crypto.randomUUID(),job_id:id,candidate_id:state.profile.id,profile_snapshot:structuredClone(state.profile),cv_path:null,job_snapshot:structuredClone(state.jobs.find(j=>j.id===id)),status:'applied',created_at:new Date().toISOString(),email_status:'disabled'});}else{const {error}=await db.rpc('apply_to_job',{target_job:id});if(error)throw error;}
  closeModal();await load();toast('Application saved');
 }else if(form.id==='candidate-form'){
  if(state.demo){if(form.dataset.id)toast('Password changes are disabled in the demo.');else{if(state.candidates.some(p=>p.email===get('email')))throw Error('This email already exists.');state.candidates.unshift({...seedDemo().profile,id:crypto.randomUUID(),full_name:get('full_name'),email:get('email'),skills:[],roles:'',phone:'',city:'',cv_path:null,cv_name:null,must_change_password:true});toast('Saved');}}else await api({action:form.dataset.id?'reset-password':'create-candidate',user_id:form.dataset.id||undefined,email:get('email'),full_name:get('full_name'),password:data.get('password'),identity_verified:yes('verified')});
  form.reset();closeModal();await load();toast('Saved');
 }else if(form.id==='status-form'){
  if(state.demo)state.applications.find(a=>a.id===form.dataset.id).status=get('status');else{const {error}=await db.rpc('set_application_status',{application_id:form.dataset.id,next_status:get('status')});if(error)throw error;}closeModal();await load();toast('Saved');
 }
}
async function guarded(fn,buttonEl){if(state.busy)return;state.busy=true;if(buttonEl)buttonEl.disabled=true;try{await fn();}catch(e){console.error(e);toast(e.message||'Something went wrong. Please try again.',true);}finally{state.busy=false;if(buttonEl?.isConnected)buttonEl.disabled=false;}}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action],[data-page]');if(!el)return;if(el.dataset.page){state.page=el.dataset.page;render();return;}if(el.type==='submit')return;e.preventDefault();guarded(()=>action(el.dataset.action,el.dataset.id),el);});
document.addEventListener('submit',e=>{e.preventDefault();guarded(()=>submit(e.target),e.submitter);});
document.addEventListener('change',e=>{if(e.target.id==='language'){state.lang=e.target.value;localStorage.setItem('sj-language',state.lang);document.documentElement.lang=state.lang;closeModal();render();}if(e.target.id==='show-password'){const field=document.querySelector('#login-form input[name="password"]');field.type=e.target.checked?'text':'password';}if(e.target.id==='job-city'||e.target.id==='job-mode'){state[e.target.id==='job-city'?'city':'mode']=e.target.value;document.querySelector('#jobs-list').innerHTML=jobCards();}});
document.addEventListener('input',e=>{if(e.target.id==='job-search'){state.search=e.target.value;document.querySelector('#jobs-list').innerHTML=jobCards();}if(e.target.id==='candidate-search')document.querySelector('#candidate-list').innerHTML=candidateRows(e.target.value);});
async function init(){document.documentElement.lang=state.lang;renderAuth();if(cfg.supabaseUrl&&cfg.supabaseAnonKey){try{const {createClient}=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8/+esm');db=createClient(cfg.supabaseUrl,cfg.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});const {data,error}=await db.auth.getSession();if(error)throw error;session=data.session;if(session)await load();}catch(e){state.profile=null;renderAuth();toast(e.message||'Unable to connect to Supabase.',true);}}}
init();

state.demo=true;demoData=seedDemo();state.admin=false;state.page='jobs';load();

</script>
</body>
